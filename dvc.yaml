stages:
  data_ingestion:
    cmd: python main.py data_ingestion
    deps:
      - src/components/data_ingestion.py
      - src/configuration/mongodb_connection.py
      - src/data_access/mongodb_data.py
    params:
      - data_ingestion.train_test_split_ratio
      - data_ingestion.random_state
    outs:
      - artifacts/data_ingestion/feature_store/raw_data.csv
      - artifacts/data_ingestion/ingested/train.csv
      - artifacts/data_ingestion/ingested/test.csv

  data_validation:
    cmd: python main.py data_validation
    deps:
      - src/components/data_ingestion.py
      - src/components/data_validation.py
    outs:
      - artifacts/data_validation/validation_report.json

  data_transformation:
    cmd: python main.py data_transformation
    deps:
      - src/components/data_ingestion.py
      - src/components/data_validation.py
      - src/components/data_transformation.py
    outs:
      - artifacts/data_transformation/transformed_data/train.npy
      - artifacts/data_transformation/transformed_data/test.npy
      - artifacts/data_transformation/transformation_objects/preprocessing.pkl